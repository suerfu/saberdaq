module {
    daq {
        logic_trigger {
            enable : true,
            random_trigger : false,
            address : 0x10000000,
            trigger_mode : pc,
            enable_crystal_retrigger : false,
            enable_pc_retrigger : true,
            veto_mask : 0x7,
            majority_level : 3,
            signal_delay : 1,
            trigger_time : 2,
            crystal_gate_length : 0x1,
            pc_gate_length : 0x6,
            dead_time : 0xff,
            veto_time : 0xff,
        }

        board0 {
            enable : true,
            address : 0x32110000,

            trigger_over_threshold : false,
            trigger_overlap : false,

            software_trigger_enable : false,
            external_trigger_enable : true,

            fp_software_trigger_out_enable : false,
            fp_external_trigger_out_enable : false,

            logic_TTL   : true,
            LVDS_IO_out : true,

            run_mode : register_controlled,

            custom_size_enable : true,
        
            pre_trigger_window_us : 0.5,   # minimum 0.016
            post_trigger_window_us : 6,   # minimum is about 0.3

            channel0 {
                enable  : true,
                threshold : 3900, # 3840
                time_cross_threshold : 0,
                DAC : 7750,  # with 7750, baseline is close to 3980
                local_trigger_enable : false,
                fp_local_trigger_out_enable : false,
                label : pc,
            }

            channel1 {
                enable  : true,
                threshold : 3900, # 3840
                time_cross_threshold : 0,
                DAC : 8200, # 8650
                local_trigger_enable : false,
                fp_local_trigger_out_enable : false,
                label : pc,
            }

            channel2 {
                enable : true,
                threshold : 3900,
                time_cross_threshold :  4,
                DAC : 8250,
                local_trigger_enable : false,
                fp_local_trigger_out_enable : false,
                label : nai,
            }

            channel* {
                enable  : false,
                threshold : 2046,
                time_cross_threshold : 0x76,
                DAC : 0x765,
                local_trigger_enable : false,
                fp_local_trigger_out_enable : false,
            }
        }
    }
